<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RentCast Dashboard</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #005f73, #0a9396);
            --card-bg: #ffffff;
            --text-color: #003d44;
            --input-bg: #ffffff;
            --input-border: #c7c7c7;
            --link-color: #005f73;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            transition: background 0.4s ease;
        }

        .card {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 35px 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            transition: background 0.4s ease, color 0.4s ease;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--link-color);
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-color);
        }

        input:focus {
            border-color: #0a9396;
            outline: none;
            box-shadow: 0 0 5px rgba(10,147,150,0.4);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 13px;
            cursor: pointer;
            font-size: 14px;
            color: #0a9396;
            user-select: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0a9396;
            color: white;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #007f83;
        }

        .signup-link {
            margin-top: 18px;
            text-align: center;
        }

        a {
            color: var(--link-color);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            color: #ff4b4b;
            text-align: center;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>🔑 Login</h1>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>

        <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <span class="toggle-password" onclick="togglePassword()">👁</span>
        </div>

        <button type="submit">Log In</button>

        <p style="margin-top: 12px; text-align: right;">
            <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
        </p>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="signup-link">
        <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p>
    </div>
</div>

<script>
    function togglePassword() {
        const pwd = document.getElementById("password");
        pwd.type = pwd.type === "password" ? "text" : "password";
    }
</script>

</body>
</html>
