<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | RentCast Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #005f73, #0a9396);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #005f73;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0a9396;
            color: white;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #007f83;
        }

        a {
            text-decoration: none;
            color: #005f73;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            color: #ff4b4b;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .success {
            color: #009e60;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .input-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 11px;
            cursor: pointer;
            font-size: 14px;
            color: #0a9396;
            user-select: none;
        }

        .hint {
            font-size: 13px;
            color: #b00020;
            margin-top: -8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🔐 Reset Password</h1>

    <form method="POST" onsubmit="return handleSubmit(event)">
        {% if show_reset %}
            <input type="hidden" name="step" value="reset">
        {% else %}
            <input type="hidden" name="step" value="lookup">
        {% endif %}

        <!-- USERNAME -->
        <input type="text"
               name="username"
               placeholder="Enter Username"
               value="{{ username or '' }}"
               {% if show_reset %}readonly{% endif %}
               required>

        <!-- STEP 2 CONTENT -->
        {% if show_reset %}

            <!-- SECURITY QUESTION (FROM BACKEND) -->
            <p style="font-weight:600; margin-bottom:5px;">Security Question:</p>
            <p style="background:#f1f1f1; padding:10px; border-radius:8px;">
                {{ question_text }}
            </p>

            <!-- SECURITY ANSWER -->
            <div class="input-wrapper">
                <input type="text" name="security_answer" id="security_answer"
                       placeholder="Your Answer" required>
                <span class="toggle-password" onclick="toggleField('security_answer')">👁</span>
            </div>

            <!-- NEW PASSWORD -->
            <div class="input-wrapper">
                <input type="password" name="new_password" id="new_password"
                       placeholder="New Password" required>
                <span class="toggle-password" onclick="toggleField('new_password')">👁</span>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="input-wrapper">
                <input type="password" name="confirm_password" id="confirm_password"
                       placeholder="Confirm Password" required>
                <span class="toggle-password" onclick="toggleField('confirm_password')">👁</span>
            </div>
            <div id="matchHint" class="hint" style="display:none;">
                Passwords do not match.
            </div>

        {% endif %}

        <button type="submit">Submit</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p class="success">{{ success }}</p>
    {% endif %}

    <p style="margin-top:15px; text-align:center;">
        <a href="{{ url_for('login') }}">Back to Login</a>
    </p>
</div>

<script>
    function toggleField(id) {
        const field = document.getElementById(id);
        if (!field) return;
        field.type = field.type === "password" ? "text" : "password";
    }

    function checkMatch() {
        const newPwd = document.getElementById("new_password");
        const confirmPwd = document.getElementById("confirm_password");
        const hint = document.getElementById("matchHint");

        if (!newPwd || !confirmPwd) return;

        if (confirmPwd.value && newPwd.value !== confirmPwd.value) {
            hint.style.display = "block";
        } else {
            hint.style.display = "none";
        }
    }

    // live feedback
    const newPwdInput = document.getElementById("new_password");
    const confirmPwdInput = document.getElementById("confirm_password");
    if (newPwdInput && confirmPwdInput) {
        newPwdInput.addEventListener("input", checkMatch);
        confirmPwdInput.addEventListener("input", checkMatch);
    }

    function handleSubmit(event) {
        const stepInput = document.querySelector('input[name="step"]');
        if (!stepInput) return true;

        if (stepInput.value === "reset") {
            const newPwd = document.getElementById("new_password").value;
            const confirmPwd = document.getElementById("confirm_password").value;
            if (newPwd !== confirmPwd) {
                alert("New Password and Confirm Password must match. Please type again.");
                event.preventDefault();
                return false;
            }
        }
        return true;
    }
</script>

</body>
</html>
