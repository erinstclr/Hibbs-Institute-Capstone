<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | RentCast Dashboard</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #005f73, #0a9396);
            --card-bg: #ffffff;
            --text-color: #003d44;
            --input-bg: #ffffff;
            --input-border: #c7c7c7;
            --link-color: #005f73;
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #072022, #0b3b40);
            --card-bg: #0f2526;
            --text-color: #e8f5f6;
            --input-bg: #15393b;
            --input-border: #2e5b5f;
            --link-color: #57d3cc;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            transition: background 0.4s ease;
        }

        .card {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 35px 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            transition: background 0.4s ease, color 0.4s ease;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--link-color);
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-color);
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #0a9396;
            outline: none;
            box-shadow: 0 0 5px rgba(10,147,150,0.4);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 13px;
            cursor: pointer;
            font-size: 14px;
            color: #0a9396;
            user-select: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0a9396;
            color: white;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #007f83;
        }

        .toggle-dark {
            margin-bottom: 15px;
            text-align: right;
            cursor: pointer;
            font-size: 15px;
            color: var(--link-color);
            font-weight: 600;
        }

        .back-link {
            margin-top: 18px;
            text-align: center;
        }

        a {
            color: var(--link-color);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            color: #ff4b4b;
            text-align: center;
            font-weight: 600;
            margin-top: 10px;
        }

        .success {
            color: #1d8f4d;
            text-align: center;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="toggle-dark" onclick="toggleDarkMode()">
            🌙 Toggle Dark Mode
        </div>

        <h1>🔒 Reset Password</h1>

        <form method="POST" action="{{ url_for('forgot_password') }}">

            <input type="text" name="username" placeholder="Username" required>

            <!-- New password + show/hide -->
            <div class="input-wrapper">
                <input type="password" id="new_password" name="new_password" placeholder="New Password" required>
                <span class="toggle-password" onclick="togglePwd('new_password')">👁</span>
            </div>

            <!-- Confirm password + show/hide -->
            <div class="input-wrapper">
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm New Password" required>
                <span class="toggle-password" onclick="togglePwd('confirm_password')">👁</span>
            </div>

            <button type="submit">Update Password</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}

        <div class="back-link">
            <p><a href="{{ url_for('login') }}">⬅ Back to Login</a></p>
        </div>

    </div>

    <script>
        function togglePwd(id) {
            const field = document.getElementById(id);
            field.type = field.type === "password" ? "text" : "password";
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
