<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentCast Search</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f7f9fb;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #005f73;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h2 {
            text-align: center;
            color: #005f73;
        }
        form {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 180px;
        }
        button {
            padding: 10px 16px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .add-btn {
            background-color: #0a9396;
            color: white;
        }
        .add-btn:hover {
            background-color: #007f83;
        }
        .remove-btn {
            background-color: #ee9b00;
            color: white;
        }
        .remove-btn:hover {
            background-color: #ca8a00;
        }
        .search-btn {
            background-color: #005f73;
            color: white;
        }
        .search-btn:hover {
            background-color: #004852;
        }
        .logout-btn {
            background-color: #ae2012;
            color: white;
        }
        .logout-btn:hover {
            background-color: #8b1810;
        }
        .zip-list {
            margin-top: 15px;
            padding: 15px;
            background-color: #e9f5f5;
            border-radius: 10px;
        }
        .zip-list h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .zip-buttons-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .zip-btn {
            padding: 8px 14px;
            background-color: #0a9396;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .zip-btn:hover {
            background-color: #007f83;
        }
        .error {
            color: #b00020;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>
<header>
    <h1>🏠 RentCast ZIP Search</h1>
</header>

<div class="container">
    <h2>Enter ZIP Codes to View Market Data</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <!-- Main form: add / remove / search all -->
    <form method="POST">
        <!-- NOTE: not required anymore so Search All can use saved ZIPs -->
        <input type="text" name="zipcode" placeholder="Enter ZIP (e.g. 75701)">
        <button type="submit" name="action" value="add" class="add-btn">Add ZIP</button>
        <button type="submit" name="action" value="remove" class="remove-btn">Remove ZIP</button>
        <button type="submit" name="action" value="search_all" class="search-btn">Search All</button>
    </form>

    <div class="zip-list">
        <h3>ZIPs in your list:</h3>

        {% if zip_list and zip_list|length > 0 %}
            <!-- Separate form so each ZIP is a quick-search button -->
            <form method="POST" class="zip-buttons-form">
                {% for z in zip_list %}
                    <button type="submit"
                            name="action"
                            value="search_single_{{ z }}"
                            class="zip-btn">
                        {{ z }}
                    </button>
                {% endfor %}
            </form>
        {% else %}
            <p>No ZIPs added yet.</p>
        {% endif %}
    </div>

    <div style="margin-top: 25px; text-align:center;">
        <a href="{{ url_for('request_zip') }}">
            <button type="button" class="search-btn">Run Backend Refresh</button>
        </a>
        <a href="{{ url_for('logout') }}">
            <button type="button" class="logout-btn">Logout</button>
        </a>
    </div>
</div>
</body>
</html>
